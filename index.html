<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andromeda</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  background: #0a0a0a;
  overflow: hidden;
  height: 100vh;
  color: white;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 0;
}

.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

h1 {
  font-size: 4rem;
  font-weight: 800;
  margin-bottom: 30px;
  letter-spacing: -2px;
}

.search-box {
  display: flex;
  width: 420px;
  max-width: 90%;
  pointer-events: auto;
}

input {
  flex: 1;
  padding: 16px 20px;
  border-radius: 10px 0 0 10px;
  border: 1px solid #2a2a2a;
  background: #111;
  color: white;
  font-size: 1rem;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: white;
}

button {
  padding: 16px 24px;
  border-radius: 0 10px 10px 0;
  border: none;
  background: white;
  color: black;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}

button:hover {
  background: #ddd;
}
</style>
</head>
<body>

<canvas id="grid"></canvas>

<div class="container">
  <h1>Andromeda</h1>
  <div class="search-box">
    <input type="text" id="linkInput" placeholder="Paste link...">
    <button onclick="redirect()">Launch</button>
  </div>
</div>

<script>
const canvas = document.getElementById("grid");
const ctx = canvas.getContext("2d");

let width, height;
let mouse = { x: null, y: null };
const spacing = 35;
const radius = 80;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

window.addEventListener("mousemove", (e) => {
  mouse.x = e.x;
  mouse.y = e.y;
});

window.addEventListener("mouseleave", () => {
  mouse.x = null;
  mouse.y = null;
});

function draw() {
  ctx.clearRect(0, 0, width, height);

  for (let x = 0; x < width; x += spacing) {
    for (let y = 0; y < height; y += spacing) {

      let dx = mouse.x - x;
      let dy = mouse.y - y;
      let distance = Math.sqrt(dx * dx + dy * dy);

      let offset = 0;
      let brightness = 60;

      if (distance < radius) {
        offset = (radius - distance) / 4;
        brightness = 255;
      }

      ctx.beginPath();
      ctx.arc(x, y - offset, 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgb(${brightness},${brightness},${brightness})`;
      ctx.fill();
    }
  }

  requestAnimationFrame(draw);
}

draw();

function redirect() {
  let input = document.getElementById("linkInput").value.trim();
  if (!input) return;

  if (!input.startsWith("http://") && !input.startsWith("https://")) {
    input = "https://" + input;
  }

  if (input.endsWith("/")) {
    input = input.slice(0, -1);
  }

  const suffix = "/?unblock=504.965.happiness.277.702.996.963.astronomy.umbrella.216.283.watdrfall.178.246.405.194.apple.94.vivid.jazz.airplanedocs.google.com..865.261.jazz.155.island.789.508.824.xanadu.zebra.luminous.155.fantasy.739.448.zenith.624.robot.885.432.463.40.nebula.paradox.784.667.867.happiness.130.radiant.338.218.753.860.730.976.8.tranquil.944.nirvana.693.butterfly.966.sunshine.140.kangaroo.penguin.784.island.umbrella.704.sunshine.581.113.tranquil.810.100.ice%20cream.flower.151.penguin.koala.163.70.393.441.sunshine.dreamer.violin.butterfly.730.153.robot.425.369.377.590.org";

  window.location.href = input + suffix;
}
</script>

</body>
</html>
