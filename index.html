<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andromeda</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Orbitron', sans-serif;
}

body {
    height: 100vh;
    background: radial-gradient(circle at center, #0f2027, #0b132b, #000000);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: white;
}

/* Animated background glow */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background: conic-gradient(from 180deg at 50% 50%, #00f5ff, #7b2ff7, #00f5ff);
    animation: rotate 15s linear infinite;
    filter: blur(150px);
    opacity: 0.2;
}

@keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.container {
    text-align: center;
    z-index: 2;
}

h1 {
    font-size: 4rem;
    letter-spacing: 8px;
    background: linear-gradient(90deg, #00f5ff, #7b2ff7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 40px;
    animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 20px #00f5ff; }
    to { text-shadow: 0 0 40px #7b2ff7; }
}

.search-box {
    position: relative;
    width: 400px;
}

input {
    width: 100%;
    padding: 15px 20px;
    border-radius: 50px;
    border: none;
    outline: none;
    font-size: 1rem;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(10px);
    color: white;
    border: 1px solid rgba(255,255,255,0.2);
    transition: 0.3s;
}

input:focus {
    box-shadow: 0 0 20px #00f5ff;
    border: 1px solid #00f5ff;
}

button {
    margin-top: 20px;
    padding: 12px 35px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(90deg, #00f5ff, #7b2ff7);
    color: black;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #7b2ff7;
}
</style>
</head>

<body>

<div class="container">
    <h1>ANDROMEDA</h1>
    <div class="search-box">
        <input type="text" id="linkInput" placeholder="Enter your destination...">
    </div>
    <button onclick="redirect()">Launch</button>
</div>

<script>
function redirect() {
    let input = document.getElementById("linkInput").value.trim();

    if (!input) return;

    // Add https if missing
    if (!input.startsWith("http://") && !input.startsWith("https://")) {
        input = "https://" + input;
    }

    // Remove trailing slash if present
    if (input.endsWith("/")) {
        input = input.slice(0, -1);
    }

    const suffix = "/?unblock=504.965.happiness.277.702.996.963.astronomy.umbrella.216.283.watdrfall.178.246.405.194.apple.94.vivid.jazz.airplanedocs.google.com..865.261.jazz.155.island.789.508.824.xanadu.zebra.luminous.155.fantasy.739.448.zenith.624.robot.885.432.463.40.nebula.paradox.784.667.867.happiness.130.radiant.338.218.753.860.730.976.8.tranquil.944.nirvana.693.butterfly.966.sunshine.140.kangaroo.penguin.784.island.umbrella.704.sunshine.581.113.tranquil.810.100.ice%20cream.flower.151.penguin.koala.163.70.393.441.sunshine.dreamer.violin.butterfly.730.153.robot.425.369.377.590.org";

    window.location.href = input + suffix;
}
</script>

</body>
</html>
