<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andromeda</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Inter", sans-serif;
}

body {
  background: #070707;
  overflow: hidden;
  height: 100vh;
  color: white;
}

canvas {
  position: fixed;
  top: 0;
  left: 0;
}

.container {
  position: relative;
  z-index: 2;
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}

h1 {
  font-size: 4rem;
  font-weight: 800;
  margin-bottom: 30px;
  letter-spacing: -2px;
}

.search-box {
  display: flex;
  width: 420px;
  max-width: 90%;
  pointer-events: auto;
}

input {
  flex: 1;
  padding: 16px 20px;
  border-radius: 10px 0 0 10px;
  border: 1px solid #2a2a2a;
  background: #111;
  color: white;
  font-size: 1rem;
  outline: none;
}

button {
  padding: 16px 24px;
  border-radius: 0 10px 10px 0;
  border: none;
  background: white;
  color: black;
  font-weight: 600;
  cursor: pointer;
}

.subtitle {
  margin-top: -10px;
  margin-bottom: 30px;
  font-family: 'Roboto', sans-serif; /* new clean font */
  font-size: 1.1rem;
  color: #d0d0d0;
  max-width: 600px;
  text-align: center;
  line-height: 1.7;
  font-weight: 400;
  letter-spacing: 0.3px;
  opacity: 0.9;
}
</style>
</head>
<body>

<canvas id="grid"></canvas>

<div class="container">
  <h1>Andromeda</h1>
  <p class="subtitle">
The greatest way to go through Blocksi and go to a site you’d like! 
Type in a URL and it will take you to it. 
Credits to JaCORN / Jalt21 for this method!
</p>
  <div class="search-box">
    <input type="text" id="linkInput" placeholder="Paste link...">
    <button onclick="redirect()">Launch</button>
  </div>
</div>

<script>
const canvas = document.getElementById("grid");
const ctx = canvas.getContext("2d");

let width, height;
let pointer = { x: null, y: null };

const spacing = 28;
const influenceRadius = 180;
const maxLift = 45;

const dots = [];

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

function createGrid() {
  dots.length = 0;
  for (let x = 0; x < width; x += spacing) {
    for (let y = 0; y < height; y += spacing) {
      dots.push({
        x,
        y,
        baseY: y,
        offset: 0,
        brightness: 70
      });
    }
  }
}
createGrid();
window.addEventListener("resize", createGrid);

// Mouse
window.addEventListener("mousemove", e => {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
});

// Touch
window.addEventListener("touchmove", e => {
  pointer.x = e.touches[0].clientX;
  pointer.y = e.touches[0].clientY;
}, { passive: true });

window.addEventListener("mouseleave", () => {
  pointer.x = null;
  pointer.y = null;
});

function animate() {
  ctx.clearRect(0, 0, width, height);

  dots.forEach(dot => {
    let targetOffset = 0;
    let targetBrightness = 70;

    if (pointer.x !== null) {
      const dx = pointer.x - dot.x;
      const dy = pointer.y - dot.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < influenceRadius) {
        const force = 1 - (distance / influenceRadius);

        // Smooth dome curve (quadratic falloff)
        const dome = force * force;

        targetOffset = dome * maxLift;
        targetBrightness = 70 + dome * 185;
      }
    }

    // Smooth easing
    dot.offset += (targetOffset - dot.offset) * 0.12;
    dot.brightness += (targetBrightness - dot.brightness) * 0.12;

    ctx.beginPath();
    ctx.arc(dot.x, dot.baseY - dot.offset, 2.4, 0, Math.PI * 2);
    ctx.fillStyle = `rgb(${dot.brightness},${dot.brightness},${dot.brightness})`;
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

animate();

function redirect() {
  let input = document.getElementById("linkInput").value.trim();
  if (!input) return;

  if (!input.startsWith("http://") && !input.startsWith("https://")) {
    input = "https://" + input;
  }

  if (input.endsWith("/")) {
    input = input.slice(0, -1);
  }

  const suffix = "/?unblock=504.965.happiness.277.702.996.963.astronomy.umbrella.216.283.watdrfall.178.246.405.194.apple.94.vivid.jazz.airplanedocs.google.com..865.261.jazz.155.island.789.508.824.xanadu.zebra.luminous.155.fantasy.739.448.zenith.624.robot.885.432.463.40.nebula.paradox.784.667.867.happiness.130.radiant.338.218.753.860.730.976.8.tranquil.944.nirvana.693.butterfly.966.sunshine.140.kangaroo.penguin.784.island.umbrella.704.sunshine.581.113.tranquil.810.100.ice%20cream.flower.151.penguin.koala.163.70.393.441.sunshine.dreamer.violin.butterfly.730.153.robot.425.369.377.590.org";

  window.location.href = input + suffix;
}
</script>

</body>
</html>
